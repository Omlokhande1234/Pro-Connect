spring.application.name=connection-service
server.port=${SERVER_PORT}

spring.neo4j.uri=${DB_URL}
spring.neo4j.authentication.username=${DB_USERNAME}
spring.neo4j.authentication.password=${DB_PASSWORD}
server.servlet.context.path=${SERVER_SERVLET_CONTEXT_PATH}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
spring.data.neo4j.database=${DATABASE_NAME}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${EUREKA_INSTANCE_IP_ADDRESS}